name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"

      - name: Run tests
        run: |
          mkdir -p ./testdata/fake-aws-bin
          go build -o ./testdata/fake-aws-bin/aws ./testdata/fake-aws
          CONVERGENCI_AWS_CLI_PATH="$PWD/testdata/fake-aws-bin/aws" \
            go test -timeout 5m ./...

      - name: Import GPG key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          fingerprint: 6B1667EFE795957739DCC0ECE47E882C7D4400F1
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      # Fail fast (before the multi-minute build) if the key cannot sign,
      # e.g. because the key or its signing subkey has expired.
      - name: Verify GPG key can sign
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          gpg --list-secret-keys --list-options show-unusable-subkeys "$GPG_FINGERPRINT"
          if ! echo "preflight" | gpg --batch --local-user "$GPG_FINGERPRINT" --detach-sign --output /dev/null; then
            echo "::error::GPG key $GPG_FINGERPRINT cannot sign (expired/revoked key or subkey?). Extend its expiry and update the GPG_PRIVATE_KEY secret."
            exit 1
          fi

      - name: Release via goreleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Sign release artifacts
        run: |
          cd dist
          set -euo pipefail
          shopt -s nullglob
          for artifact in *.tar.gz *.zip checksums.txt; do
            gpg --batch --yes --detach-sign --local-user "${{ steps.import_gpg.outputs.fingerprint }}" "$artifact"
          done
        shell: bash

      - name: Upload GPG signatures
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.sig

      - name: Publish SHA256 sidecars
        run: |
          cd dist
          for file in *.tar.gz *.zip; do
            sha256sum "$file" | awk '{print $1}' > "$file.sha256"
          done
        shell: bash

      - name: Upload SHA256 sidecars to release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.sha256
